<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Galaxy Particle Background</title>

<style>

html,body{
margin:0;
padding:0;
overflow:hidden;
background:#020617;
width:100%;
height:100%;
}


#app{
width:100%;
height:100%;
}


canvas{
display:block;
}

</style>

</head>


<body>


<div id="app"></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>



<script>


let scene;
let camera;
let renderer;
let stars;



let mouseX=0;
let mouseY=0;



const mobile =
window.innerWidth < 700;



// تعداد ستاره ها

const COUNT =
mobile ? 1500 : 3500;



init();

animate();





function init(){



scene =
new THREE.Scene();




// عمق مه مانند

scene.fog =
new THREE.FogExp2(
0x020617,
0.0008
);





camera =
new THREE.PerspectiveCamera(

60,

innerWidth/innerHeight,

1,

10000

);



camera.position.z=800;





renderer =
new THREE.WebGLRenderer({

alpha:true,

antialias:true,

powerPreference:"high-performance"

});



renderer.setPixelRatio(

Math.min(
devicePixelRatio,
2
)

);



renderer.setSize(
innerWidth,
innerHeight
);



document
.getElementById("app")
.appendChild(
renderer.domElement
);




createGalaxy();




window.addEventListener(
"resize",
resize
);



window.addEventListener(
"mousemove",
move
);


window.addEventListener(
"touchmove",
touch,
{
passive:true
}
);


}









function createGalaxy(){



let geometry =
new THREE.BufferGeometry();



let positions =
new Float32Array(
COUNT*3
);


let colors =
new Float32Array(
COUNT*3
);




for(
let i=0;
i<COUNT;
i++
){



let radius =
Math.random()*1800;



let angle =
Math.random()*Math.PI*2;



// فرم مارپیچی کهکشان

let spiral =
radius*0.002;



let x =
Math.cos(angle+spiral)
*
radius;


let z =
Math.sin(angle+spiral)
*
radius;


let y =
(
Math.random()-0.5
)
*
400;



positions[i*3]=x;


positions[i*3+1]=y;


positions[i*3+2]=z;




// رنگ ستاره ها

let c =
Math.random();



colors[i*3]=
0.3+c*0.7;


colors[i*3+1]=
0.5+c*0.5;


colors[i*3+2]=
1;





}





geometry.setAttribute(

"position",

new THREE.BufferAttribute(
positions,
3
)

);



geometry.setAttribute(

"color",

new THREE.BufferAttribute(
colors,
3
)

);






let material =
new THREE.PointsMaterial({

size:
mobile?3:4,


vertexColors:true,


transparent:true,


opacity:.85,


blending:
THREE.AdditiveBlending,


depthWrite:false

});





stars =
new THREE.Points(

geometry,

material

);



scene.add(
stars
);




}








function animate(){


requestAnimationFrame(
animate
);





stars.rotation.y +=0.0008;


stars.rotation.x +=0.0002;





camera.position.x +=

(
mouseX*250 -
camera.position.x
)
*
0.02;



camera.position.y +=

(
mouseY*150 -
camera.position.y
)
*
0.02;




camera.lookAt(
scene.position
);





renderer.render(
scene,
camera
);


}








function move(e){



mouseX =
(
e.clientX /
innerWidth
-
0.5
)
*
2;



mouseY =
(
e.clientY /
innerHeight
-
0.5
)
*
2;


}






function touch(e){



let t =
e.touches[0];



mouseX =
(
t.clientX /
innerWidth
-
0.5
)
*
2;



mouseY =
(
t.clientY /
innerHeight
-
0.5
)
*
2;


}







function resize(){


camera.aspect =
innerWidth /
innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(

innerWidth,

innerHeight

);


}



</script>


</body>
</html>
